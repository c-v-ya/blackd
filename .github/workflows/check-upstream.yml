name: check-upstream

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - only check, do not create release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get upstream version
        id: upstream
        run: |
          VERSION=$(curl -s https://api.github.com/repos/psf/black/releases/latest \
            | grep '"tag_name"' | cut -d '"' -f 4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get local latest version
        id: local
        run: |
          VERSION=$(git tag --sort=-version:refname | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          echo "Upstream: ${{ steps.upstream.outputs.version }}"
          echo "Local:    ${{ steps.local.outputs.version }}"
          if [ "${{ steps.upstream.outputs.version }}" = "${{ steps.local.outputs.version }}" ]; then
            echo "Versions are equal, nothing to do"
            echo "newer=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n%s' "${{ steps.local.outputs.version }}" "${{ steps.upstream.outputs.version }}" \
            | sort -V | tail -1 | grep -q "${{ steps.upstream.outputs.version }}"; then
            echo "Upstream is newer"
            echo "newer=true" >> "$GITHUB_OUTPUT"
          else
            echo "Local is ahead, nothing to do"
            echo "newer=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.compare.outputs.newer == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          echo "Creating release $VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "[Details](https://github.com/psf/black/releases/tag/$VERSION)"

      - name: Dry run output
        if: steps.compare.outputs.newer == 'true' && (github.event.inputs.dry_run == 'true' || github.event_name == 'schedule')
        run: |
          echo "::notice::DRY RUN: Would create release ${{ steps.upstream.outputs.version }} (current: ${{ steps.local.outputs.version }})"
